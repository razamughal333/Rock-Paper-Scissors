<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="nav">
      <div class="logo">
        <p>RPS.</p>
      </div>
      <h1>Rock Paper Scissors</h1>
    </div>

    <!--Game Area-->
    <main>
      <div class="game">
        <div class="choices">
          <button id="rock" class="choice">
            <i class="fa-regular fa-hand-back-fist"></i>
          </button>
          <button id="paper" class="choice">
            <i class="fa-regular fa-hand"></i>
          </button>
          <button id="scissors" class="choice">
            <i class="fa-regular fa-hand-scissors"></i>
          </button>
        </div>
        <!--Display Result-->
        <div class="score">
          <p>You: <span id="player-score">0</span></p>
          <p>Computer: <span id="computer-score">0</span></p>
          <p>Draws: <span id="draw-score">0</span></p>
          <hr />
        </div>
        <p class="instruction">Pick your choice!</p>
        <br />
        <div class="result">
          <p id="result-message"></p>
        </div>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
